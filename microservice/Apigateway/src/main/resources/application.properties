server.port=9090
spring.application.name= api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.sleuth.reactor.instrumentationType= decorate-on-each

spring.cloud.compatibility-verifier.enabled=false
spring.zipkin.base-url=http://localhost:9411

# OAuth2 Resource Server Configuration
# Replace with your OAuth2 authorization server issuer URI
# Example: http://localhost:8080/auth/realms/myrealm (Keycloak)
# Example: http://localhost:9000 (Spring Authorization Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# JWT Configuration
# If using a public key directly instead of issuer-uri, uncomment below:
# spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public-key.pem

# Optional: JWT audience validation
# spring.security.oauth2.resourceserver.jwt.audiences=api-gateway-client

# Gateway Security Configuration
# Comma-separated list of public paths that don't require authentication
gateway.security.public-paths=/actuator/**,/eureka/**,/swagger-ui/**,/v3/api-docs/**,/swagger-resources/**